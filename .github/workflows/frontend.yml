name: frontend

on:
  push:
    branches: [main]
    paths: ['frontend/**', 'docs/design/**', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['frontend/**', 'docs/design/**', '.github/workflows/frontend.yml']

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Build de production : échoue si les budgets d'angular.json sont dépassés.
      - run: npm run build
