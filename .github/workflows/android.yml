name: android

# APK de démonstration (debug). La signature de production (secrets GitHub) arrive au LOT 14.
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Adresse de l'API (ex. https://serveur-production.up.railway.app/api ; réseau local : http://192.168.1.20:8080/api)"
        required: false
        default: 'http://localhost:8080/api'
      keycloak_url:
        description: "Adresse de Keycloak (ex. https://keycloak-production.up.railway.app ; réseau local : http://192.168.1.20:8180)"
        required: false
        default: 'http://localhost:8180'
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      AMBAWBIO_API_URL: ${{ inputs.api_url || 'http://localhost:8080/api' }}
      AMBAWBIO_KEYCLOAK_URL: ${{ inputs.keycloak_url || 'http://localhost:8180' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: npm ci
      - name: Adresses du serveur et de Keycloak (config.js, D-34)
        run: |
          printf "window.AMBAWBIO_CONFIG = { api: '%s', keycloak: '%s' };\n" "$AMBAWBIO_API_URL" "$AMBAWBIO_KEYCLOAK_URL" > public/config.js
          cat public/config.js
      - run: npm run android:sync
      - run: cd android && ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: ambawbio-suite-demo-apk
          path: frontend/android/app/build/outputs/apk/debug/*.apk
