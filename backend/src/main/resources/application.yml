spring:
  application:
    name: ambawbio-suite
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${AMBAWBIO_BD_URL:jdbc:postgresql://localhost:5432/ambawbio}
    username: ${AMBAWBIO_BD_UTILISATEUR:ambawbio_app}
    password: ${AMBAWBIO_BD_MOT_DE_PASSE:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: socle
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    locations: classpath:db/migration/socle,classpath:db/migration/referentiel,classpath:db/migration/sync
    schemas: socle,audit,referentiel,sync
    create-schemas: true
    # Migrations exécutées par le propriétaire des tables ; l'application utilise un rôle sans BYPASSRLS (guide §6.4).
    user: ${AMBAWBIO_BD_PROPRIETAIRE:ambawbio}
    password: ${AMBAWBIO_BD_PROPRIETAIRE_MOT_DE_PASSE:}
    placeholders:
      role_application: ${AMBAWBIO_BD_UTILISATEUR:ambawbio_app}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AMBAWBIO_KEYCLOAK_EMETTEUR:http://localhost:8180/realms/ambawbio}
          jwk-set-uri: ${AMBAWBIO_KEYCLOAK_JWKS:http://localhost:8180/realms/ambawbio/protocol/openid-connect/certs}

server:
  # Réponses compressées (pull de synchronisation, listes) : indispensable en 3G (ENF-02).
  compression:
    enabled: true
    mime-types: application/json,application/problem+json,text/csv
    min-response-size: 1KB

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

ambawbio:
  sync:
    taille-plage: ${AMBAWBIO_TAILLE_PLAGE:500}
    operations-par-lot: 100
    changements-par-page: 500
  annuaire:
    mode: ${AMBAWBIO_ANNUAIRE_MODE:keycloak}
    url: ${AMBAWBIO_KEYCLOAK_URL:http://localhost:8180}
    royaume: ambawbio
    client-id: ambawbio-serveur
    secret: ${AMBAWBIO_KEYCLOAK_SECRET:}
  cors:
    origines: ${AMBAWBIO_CORS_ORIGINES:http://localhost:4200,https://localhost}
